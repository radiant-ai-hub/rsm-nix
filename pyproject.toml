[project]
name = "rsm-msba-base"
version = "0.1.0"
description = "Course-core Python environment for the RSM-MSBA Nix flake"
requires-python = ">=3.13,<3.14"
dependencies = [
  # notebooks
  "ipykernel>=6.29",
  "ipython>=8.30",
  "jupyter-client>=8.6",
  "jupyter-core>=5.7",
  "nbclient>=0.10",
  "nbconvert>=7.16",
  "jupytext>=1.16",
  "ipywidgets>=8.1",
  # data
  "numpy>=2.1",
  "pandas>=2.2",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "linearmodels>=6.1",
  "polars>=1.9",
  "pyarrow>=18.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "xlsx2csv>=0.8",
  # database
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "connectorx>=0.4",
  # visualization / utilities
  "plotnine>=0.13",
  "graphviz>=0.20",
  "folium>=0.18",
  "networkx>=3.4",
  "markdown>=3.7",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "requests>=2.32",
  # RSM / course packages
  "pyrsm>=1.1",
  # xgboost: on Linux use the `xgboost-cpu` distribution to avoid pulling
  # ~500 MB of nvidia CUDA wheels (nccl) that CPU coursework never uses.
  # On macOS there is no CUDA and `xgboost-cpu` ships no wheel, so use the
  # regular `xgboost` (already CPU-only there). Both import as `xgboost`.
  "xgboost-cpu>=2.1; sys_platform == 'linux'",
  "xgboost>=2.1; sys_platform != 'linux'",
  "scikit-misc>=0.5",
  # text / NLP basics
  "beautifulsoup4>=4.12",
  "nltk>=3.9",
  "spacy>=3.8",
  "textblob>=0.18",
]

[tool.uv]
# This project is an environment, not an installable package.
package = false
