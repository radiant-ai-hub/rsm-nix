name: Test Installers

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'install/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/test-installers.yml'
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer dry run
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $errors = $null
          $null = [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content .\install\windows-install-rsm-nix.ps1 -Raw),
            [ref]$errors
          )
          if ($errors) {
            $errors | Format-List | Out-String | Write-Host
            throw "PowerShell parser reported errors."
          }

      - name: Run dry-run validation
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          .\install\windows-install-rsm-nix.ps1 -DryRun -SkipWorkspaceSetup

      - name: Regression - installs WSL when it is missing
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          # -SimulateMissingWsl forces the "wsl.exe absent" branch even though the
          # runner has WSL, so we can assert the installer actually installs WSL
          # (enables both required Windows features) instead of bailing out.
          # 6>&1 merges the Information stream (Write-Host/Write-Detail) into the
          # pipeline so Out-String actually captures it on Windows PowerShell 5.1.
          $out = .\install\windows-install-rsm-nix.ps1 -DryRun -SkipWorkspaceSetup -SimulateMissingWsl 6>&1 | Out-String
          Write-Host $out
          foreach ($needle in @(
            "Microsoft-Windows-Subsystem-Linux",
            "VirtualMachinePlatform",
            "Microsoft.WSL",
            "wsl --install --no-distribution",
            "reboot is required"
          )) {
            if ($out -notmatch [regex]::Escape($needle)) {
              throw "WSL-install regression: expected '$needle' in the missing-WSL install path, but it was absent."
            }
          }
          Write-Host "OK: missing-WSL path installs WSL (both features + wsl --install) and requires a reboot."

      - name: Regression - detects a stray Ubuntu distro
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          # A stray 'Ubuntu' (e.g. from 'wsl --install') alongside the target must
          # be flagged for cleanup; a non-Ubuntu distro (Debian) must NOT be.
          $out = .\install\windows-install-rsm-nix.ps1 -DryRun -SkipWorkspaceSetup -SimulateInstalledDistros "Ubuntu,Ubuntu-26.04" 6>&1 | Out-String
          Write-Host $out
          foreach ($needle in @("Found other Ubuntu", "unregister")) {
            if ($out -notmatch [regex]::Escape($needle)) {
              throw "stray-Ubuntu regression: expected '$needle' when a stray Ubuntu is present, but it was absent."
            }
          }
          $out2 = .\install\windows-install-rsm-nix.ps1 -DryRun -SkipWorkspaceSetup -SimulateInstalledDistros "Debian,Ubuntu-26.04" 6>&1 | Out-String
          if ($out2 -match "Found other Ubuntu") {
            throw "stray-Ubuntu regression: Debian must NOT be flagged as a stray Ubuntu."
          }
          Write-Host "OK: stray Ubuntu flagged for cleanup; Debian left alone."

      - name: Installer unit + integration tests (PowerShell 7)
        shell: pwsh
        run: ./tests/test-windows-installer.ps1

      - name: Installer tests under Windows PowerShell 5.1
        shell: powershell
        run: .\tests\test-windows-installer.ps1

  macos:
    name: macOS ARM installer dry run
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate bash syntax
        run: bash -n install/macos-arm-install-rsm-nix.sh

      - name: Run dry-run validation
        run: bash install/macos-arm-install-rsm-nix.sh --dry-run --skip-workspace-setup

      - name: Regression - recovers a half-created Nix Store volume
        run: |
          # -simulate-broken-nix-volume forces the "a previous run left an
          # unmounted Nix Store volume" branch. In --dry-run it must PROPOSE
          # cleanup and tell the student to restart, and must NOT delete anything.
          out="$(bash install/macos-arm-install-rsm-nix.sh --dry-run --skip-vscode --skip-workspace-setup --simulate-broken-nix-volume 2>&1)"
          echo "$out"
          for needle in "Nix Store" "restart your Mac"; do
            echo "$out" | grep -qi "$needle" || { echo "FAIL: expected '$needle' in the recovery dry-run output"; exit 1; }
          done
          echo "$out" | grep -qi "deleteVolume" && { echo "FAIL: dry-run must not run diskutil deleteVolume"; exit 1; } || true
          echo "OK: half-created Nix Store volume is detected, cleanup proposed, no auto-delete/reboot."

  linux:
    name: Shell syntax
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate bash scripts
        run: |
          bash -n install/macos-arm-install-rsm-nix.sh
          bash -n install/linux-install-rsm-nix.sh
          bash -n install/ubuntu-server-rsm-nix.sh
          bash -n bin/rsm-setup
          bash -n bin/rsm-python-sync
          bash -n bin/rsm-env.sh
          bash -n bin/rsm-ssh-setup
          bash -n bin/github
          bash -n bin/rsm-github
          bash -n tests/check-default.sh
          bash -n tests/check-folders.sh
          bash -n tests/check-no-host-mutation.sh
          bash -n tests/check-postgres.sh
          bash -n tests/check-spark-hadoop.sh
          bash -n tests/check-data-seed.sh
          bash -n tests/check-reexec.sh
          bash -n tests/check-macos-nix-recovery.sh
          bash -n tests/check-vscode-keybindings.sh
          bash -n tests/check-vscode-ext.sh
          bash -n tests/check-vscode-settings.sh
          bash -n tests/check-mkdir.sh
          bash -n tests/check-claude-harness.sh
          bash -n bin/rsm-claude-settings
          for h in claude/hooks/*.sh claude/statusline.sh skills/git-workflow/scripts/git_state.sh; do bash -n "$h"; done

      - name: Data-seed no-clobber test
        run: bash tests/check-data-seed.sh

      - name: Self-update re-exec test
        run: bash tests/check-reexec.sh

      - name: macOS half-created Nix-volume recovery test
        run: bash tests/check-macos-nix-recovery.sh

      - name: VS Code keybindings merge test
        run: bash tests/check-vscode-keybindings.sh

      - name: VS Code extension sync (headless code-server) test
        run: bash tests/check-vscode-ext.sh

      - name: VS Code per-folder settings/keybindings test
        run: bash tests/check-vscode-settings.sh

      - name: Shell ls/eza + oh-my-zsh-alias regression test (zsh)
        run: |
          command -v zsh >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zsh; }
          zsh tests/check-shell-ls.zsh
