name: Nix Environment

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  nix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 26.04 x64
            runner: ubuntu-26.04
          - name: Ubuntu 26.04 ARM64
            runner: ubuntu-26.04-arm
          - name: macOS 26 ARM64
            runner: macos-26

    # Exercise the CHECKED-OUT branch's rsm-setup, not main. Without these,
    # rsm-setup clones main into ~/rsm-nix and self-update re-execs into it, so a
    # PR's rsm-setup/content changes would never actually run in the E2E.
    env:
      RSM_FLAKE: ${{ github.workspace }}
      RSM_SKIP_FLAKE_UPDATE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Determinate Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Show Nix system
        run: |
          nix --version
          nix eval --raw --impure --expr 'builtins.currentSystem'

      - name: Check flake
        run: nix flake check

      - name: Record host-mutation baseline
        run: nix develop -c bash tests/check-no-host-mutation.sh

      - name: Build workspace environment
        run: nix develop -c rsm-setup

      - name: Run default smoke checks
        run: nix develop -c bash tests/check-default.sh

      - name: Check xgboost/libomp in a terminal — shared env + isolated venv (macOS SIP)
        run: nix develop -c bash tests/check-macos-omp.sh

      - name: Check xgboost imports in the notebook kernel from kernel.json alone
        run: nix develop -c bash tests/check-notebook-imports.sh

      - name: Check quarto render of a .qmd with a python chunk (Session-4 workflow)
        run: nix develop -c bash tests/check-quarto-render.sh

      - name: Run the student diagnostic as a gate (check_environment.py --strict)
        run: nix develop -c python examples/check_environment.py --strict

      - name: Run folder layout checks
        run: nix develop -c bash tests/check-folders.sh

      - name: Compare host-mutation baseline
        run: nix develop -c bash tests/check-no-host-mutation.sh

      - name: Run Spark/Hadoop checks
        run: nix develop .#spark-hadoop -c bash tests/check-spark-hadoop.sh
